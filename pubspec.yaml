name: calculator

description: "Nexus Calc Flutter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  fl_chart: ^0.68.0
  translator: ^1.0.3+1

  ## SCIENTIFIC CALCULATOR
  function_tree: ^0.9.1

  ## UI
  google_fonts: ^6.1.0
  glassmorphism: ^3.0.0
  flutter_inset_shadow: ^2.0.0
  animated_toggle_switch: ^0.8.2
  flutter_animate: ^4.5.0

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  ## APP ICON
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/logo.png

flutter_launcher_icons:

  android: true

  ios: true

  image_path: "assets/logo.png"

  adaptive_icon_background: "#050A14"

  adaptive_icon_foreground: "assets/logo.png"